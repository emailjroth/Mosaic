<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F9F9F9" id="themeColorMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default" id="statusBarMeta">
  <meta name="apple-mobile-web-app-title" content="Mosaic">
  <meta name="description" content="Pixel mosaic generator matching the native iPad Mosaic app.">
  <title>Mosaic</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    :root {
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --blue: #007AFF;
      --red: #FF3B30;
      --gray: #8E8E93;
      --orange: #FF9500;
      --yellow: #FFCC00;
      --bg: #FFFFFF;
      --nav-bg: rgba(249, 249, 249, 0.94);
      --label: #000000;
      --secondary-label: rgba(60, 60, 67, 0.6);
      --separator: rgba(60, 60, 67, 0.12);
      --placeholder: rgba(142, 142, 147, 0.2);
      --seg-bg: rgba(118, 118, 128, 0.12);
      --seg-sel: #FFFFFF;
      --seg-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 1px 1px rgba(0, 0, 0, 0.04);
      --sheet-bg: #FFFFFF;
      --list-bg: #FFFFFF;
      --row-sep: rgba(60, 60, 67, 0.29);
      --backdrop: rgba(0, 0, 0, 0.32);
      --toolbar: rgba(249, 249, 249, 0.94);
    }

    html[data-theme="dark"] {
      --blue: #0A84FF;
      --red: #FF453A;
      --gray: #8E8E93;
      --bg: #000000;
      --nav-bg: rgba(28, 28, 30, 0.94);
      --label: #FFFFFF;
      --secondary-label: rgba(235, 235, 245, 0.6);
      --separator: rgba(84, 84, 88, 0.65);
      --placeholder: rgba(142, 142, 147, 0.2);
      --seg-bg: rgba(118, 118, 128, 0.24);
      --seg-sel: #636366;
      --seg-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
      --sheet-bg: #1C1C1E;
      --list-bg: #1C1C1E;
      --row-sep: rgba(84, 84, 88, 0.65);
      --backdrop: rgba(0, 0, 0, 0.52);
      --toolbar: rgba(28, 28, 30, 0.94);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    }

    body {
      min-height: 100dvh;
      padding-left: var(--safe-l);
      padding-right: var(--safe-r);
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--nav-bg);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 0.5px solid var(--separator);
      padding: calc(8px + var(--safe-t)) 20px 8px;
    }

    .nav h1 {
      margin: 0;
      font-size: 34px;
      line-height: 41px;
      font-weight: 700;
      letter-spacing: 0.37px;
    }

    .scroll {
      padding-bottom: calc(28px + var(--safe-b));
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1024px;
      margin: 0 auto;
      padding-top: 8px;
    }

    .image-stage {
      width: 100%;
      min-height: min(40vh, 400px);
      background: var(--bg);
    }

    .placeholder {
      margin: 16px;
      min-height: min(40vh, 400px);
      background: var(--placeholder);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--label);
      font-size: 17px;
      font-weight: 600;
    }

    .zoom-scroller {
      width: 100%;
      min-height: min(40vh, 400px);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y pinch-zoom;
      background: var(--bg);
      display: none;
    }

    #displayCanvas {
      display: block;
      margin: 0 auto;
      max-width: none;
      transform-origin: 0 0;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 16px 0 8px;
    }

    .segmented {
      display: flex;
      margin: 0 16px;
      padding: 2px;
      background: var(--seg-bg);
      border-radius: 9px;
    }

    .segmented button {
      flex: 1;
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--label);
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      min-height: 32px;
      border-radius: 7px;
      padding: 4px 6px;
    }

    .segmented button.active {
      background: var(--seg-sel);
      box-shadow: var(--seg-shadow);
      font-weight: 600;
    }

    .btn-col {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 0 16px;
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 16px;
      font: inherit;
      font-size: 17px;
      font-weight: 600;
      color: #FFFFFF;
      background: var(--blue);
      width: 100%;
    }

    .btn.full { padding-left: 16px; padding-right: 16px; }

    .pad-x { padding: 0 16px; }

    .btn.red { background: var(--red); }
    .btn:disabled { background: var(--gray); }

    .theme-wrap {
      display: flex;
      justify-content: center;
      padding: 20px 0 8px;
    }

    .theme-btn {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 8px 16px;
      color: var(--orange);
    }

    html[data-theme="dark"] .theme-btn { color: var(--yellow); }

    .theme-btn svg { width: 28px; height: 28px; display: block; }

    #fileInput { display: none; }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: var(--backdrop);
      z-index: 40;
      display: none;
      align-items: stretch;
      justify-content: center;
      padding: calc(18px + var(--safe-t)) 18px calc(18px + var(--safe-b));
    }

    .sheet-backdrop.show { display: flex; }

    .sheet {
      background: var(--sheet-bg);
      width: min(720px, 100%);
      max-height: 100%;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
    }

    .sheet-nav {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: var(--toolbar);
      border-bottom: 0.5px solid var(--separator);
    }

    .sheet-nav h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
    }

    .sheet-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-btn, .done-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--blue);
      padding: 6px;
      font: inherit;
      font-size: 17px;
    }

    .done-btn { font-weight: 600; }

    .icon-btn svg { width: 22px; height: 22px; display: block; }

    .pixel-list {
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      min-height: 0;
      background: var(--list-bg);
    }

    .pixel-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-bottom: 0.33px solid var(--row-sep);
      font-size: 17px;
    }

    .pixel-xy {
      width: 80px;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .pixel-val { flex: 1; min-width: 0; }

    .swatch {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      background: #000;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(28px + var(--safe-b));
      transform: translateX(-50%) translateY(12px);
      background: rgba(30, 30, 30, 0.92);
      color: #fff;
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 15px;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 60;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <input id="fileInput" type="file" accept="image/*">

  <div class="nav">
    <h1>Mosaic</h1>
  </div>

  <div class="scroll">
    <div class="stack">
      <div class="image-stage">
        <div id="placeholder" class="placeholder">Select an image</div>
        <div id="zoomScroller" class="zoom-scroller">
          <canvas id="displayCanvas"></canvas>
        </div>
      </div>

      <div class="controls">
        <div class="segmented" role="group" aria-label="Grid Size">
          <button type="button" data-size="small" class="active">40x25</button>
          <button type="button" data-size="medium">80x50</button>
          <button type="button" data-size="large">75x40</button>
          <button type="button" data-size="extraLarge">150x80</button>
        </div>

        <div id="selectWrap" class="pad-x">
          <button id="selectImageBtn" class="btn" type="button">Select Image</button>
        </div>

        <div id="functionWrap" class="btn-col hidden">
          <div class="btn-row">
            <button id="newImageBtn" class="btn" type="button">New Image</button>
            <button id="grayBtn" class="btn" type="button">Grayscale</button>
          </div>
          <div class="btn-row">
            <button id="processBtn" class="btn" type="button">Process</button>
            <button id="showDataBtn" class="btn" type="button" disabled>Show Data</button>
          </div>
          <div class="pad-x">
            <button id="clearBtn" class="btn red" type="button">Clear Image</button>
          </div>
        </div>
      </div>

      <div class="theme-wrap">
        <button id="themeBtn" class="theme-btn" type="button" aria-label="Toggle dark mode">
          <svg id="sunIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0-5a1 1 0 011 1v1.5a1 1 0 11-2 0V3a1 1 0 011-1zm0 16.5a1 1 0 011 1V21a1 1 0 11-2 0v-1.5a1 1 0 011-1zM3 11a1 1 0 011-1h1.5a1 1 0 110 2H4a1 1 0 01-1-1zm15.5 0a1 1 0 011-1H21a1 1 0 110 2h-1.5a1 1 0 01-1-1zM5.64 5.64a1 1 0 011.41 0l1.06 1.06a1 1 0 11-1.41 1.41L5.64 7.05a1 1 0 010-1.41zm10.25 10.25a1 1 0 011.41 0l1.06 1.06a1 1 0 11-1.41 1.41l-1.06-1.06a1 1 0 010-1.41zM5.64 18.36a1 1 0 010-1.41l1.06-1.06a1 1 0 111.41 1.41l-1.06 1.06a1 1 0 01-1.41 0zm10.25-10.25a1 1 0 010-1.41l1.06-1.06a1 1 0 111.41 1.41l-1.06 1.06a1 1 0 01-1.41 0z"/>
          </svg>
          <svg id="moonIcon" class="hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M16.5 13.5A7.5 7.5 0 119.2 4.1a8.5 8.5 0 107.3 9.4z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="dataSheet" class="sheet-backdrop" role="dialog" aria-modal="true" aria-labelledby="dataTitle">
    <div class="sheet">
      <div class="sheet-nav">
        <h2 id="dataTitle">Pixel Data</h2>
        <div class="sheet-actions">
          <button id="copyAllBtn" class="icon-btn" type="button" aria-label="Copy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="8" width="12" height="14" rx="2"></rect>
              <path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2h2"></path>
            </svg>
          </button>
          <button id="shareBtn" class="icon-btn" type="button" aria-label="Share">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v12"></path>
              <path d="M8 7l4-4 4 4"></path>
              <path d="M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"></path>
            </svg>
          </button>
          <button id="doneBtn" class="done-btn" type="button">Done</button>
        </div>
      </div>
      <div id="pixelList" class="pixel-list"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script>
    const GRID = {
      small: { horizontal: 40, vertical: 25 },
      medium: { horizontal: 80, vertical: 50 },
      large: { horizontal: 75, vertical: 40 },
      extraLarge: { horizontal: 150, vertical: 80 }
    };

    const fileInput = document.getElementById("fileInput");
    const placeholder = document.getElementById("placeholder");
    const zoomScroller = document.getElementById("zoomScroller");
    const canvas = document.getElementById("displayCanvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const selectWrap = document.getElementById("selectWrap");
    const functionWrap = document.getElementById("functionWrap");
    const selectImageBtn = document.getElementById("selectImageBtn");
    const newImageBtn = document.getElementById("newImageBtn");
    const grayBtn = document.getElementById("grayBtn");
    const processBtn = document.getElementById("processBtn");
    const showDataBtn = document.getElementById("showDataBtn");
    const clearBtn = document.getElementById("clearBtn");
    const themeBtn = document.getElementById("themeBtn");
    const sunIcon = document.getElementById("sunIcon");
    const moonIcon = document.getElementById("moonIcon");
    const dataSheet = document.getElementById("dataSheet");
    const pixelList = document.getElementById("pixelList");
    const toast = document.getElementById("toast");

    const state = {
      selectedBitmap: null,
      originalBitmap: null,
      processedBitmap: null,
      pixelData: [],
      isGrayscale: false,
      selectedGridSize: "small",
      isProcessing: false,
      isImageProcessed: false,
      isDarkMode: localStorage.getItem("isDarkMode") === "true",
      zoom: 1
    };

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    function applyTheme() {
      document.documentElement.dataset.theme = state.isDarkMode ? "dark" : "light";
      sunIcon.classList.toggle("hidden", state.isDarkMode);
      moonIcon.classList.toggle("hidden", !state.isDarkMode);
      document.getElementById("themeColorMeta").setAttribute("content", state.isDarkMode ? "#1C1C1E" : "#F9F9F9");
      document.getElementById("statusBarMeta").setAttribute("content", state.isDarkMode ? "black" : "default");
      localStorage.setItem("isDarkMode", String(state.isDarkMode));
    }
    applyTheme();

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function updateButtons() {
      const hasImage = !!state.selectedBitmap;
      selectWrap.classList.toggle("hidden", hasImage);
      functionWrap.classList.toggle("hidden", !hasImage);
      grayBtn.textContent = state.isGrayscale ? "Color" : "Grayscale";
      grayBtn.disabled = state.isProcessing;
      processBtn.textContent = state.isImageProcessed ? "Save Image" : "Process";
      processBtn.disabled = state.isProcessing;
      showDataBtn.disabled = state.pixelData.length === 0;
    }

    function currentDisplayBitmap() {
      return state.processedBitmap || state.selectedBitmap;
    }

    function fitCanvas(bitmap) {
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      ctx.imageSmoothingEnabled = true;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(bitmap, 0, 0);
      state.zoom = 1;
      canvas.style.width = "100%";
      canvas.style.maxWidth = "100%";
      canvas.style.height = "auto";
      canvas.style.transform = "none";
    }

    function showImage() {
      const bitmap = currentDisplayBitmap();
      if (!bitmap) {
        placeholder.style.display = "flex";
        zoomScroller.style.display = "none";
        return;
      }
      placeholder.style.display = "none";
      zoomScroller.style.display = "block";
      fitCanvas(bitmap);
    }

    function resetImageState() {
      if (state.selectedBitmap && state.selectedBitmap.close) state.selectedBitmap.close();
      if (state.originalBitmap && state.originalBitmap.close && state.originalBitmap !== state.selectedBitmap) {
        state.originalBitmap.close();
      }
      if (state.processedBitmap && state.processedBitmap.close) state.processedBitmap.close();
      state.selectedBitmap = null;
      state.originalBitmap = null;
      state.processedBitmap = null;
      state.pixelData = [];
      state.isGrayscale = false;
      state.isImageProcessed = false;
      pixelList.replaceChildren();
      showImage();
      updateButtons();
    }

    function openPicker() {
      fileInput.value = "";
      fileInput.click();
    }

    selectImageBtn.addEventListener("click", openPicker);
    newImageBtn.addEventListener("click", () => {
      resetImageState();
      openPicker();
    });
    clearBtn.addEventListener("click", resetImageState);

    fileInput.addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
      state.selectedBitmap = bitmap;
      state.originalBitmap = bitmap;
      state.processedBitmap = null;
      state.pixelData = [];
      state.isGrayscale = false;
      state.isImageProcessed = false;
      showImage();
      updateButtons();
    });

    document.querySelectorAll(".segmented button").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".segmented button").forEach((b) => b.classList.remove("active"));
        button.classList.add("active");
        state.selectedGridSize = button.dataset.size;
        if (state.pixelData.length) processCurrentImage();
      });
    });

    function luminance(r, g, b) {
      return 0.299 * r + 0.587 * g + 0.114 * b;
    }

    function toGrayscaleBitmap(bitmap) {
      const off = document.createElement("canvas");
      off.width = bitmap.width;
      off.height = bitmap.height;
      const octx = off.getContext("2d", { willReadFrequently: true });
      octx.drawImage(bitmap, 0, 0);
      const image = octx.getImageData(0, 0, off.width, off.height);
      const data = image.data;
      for (let i = 0; i < data.length; i += 4) {
        const y = Math.round(luminance(data[i], data[i + 1], data[i + 2]));
        data[i] = y;
        data[i + 1] = y;
        data[i + 2] = y;
      }
      octx.putImageData(image, 0, 0);
      return off;
    }

    function averageBlock(data, imageWidth, x0, y0, bw, bh) {
      let totalR = 0;
      let totalG = 0;
      let totalB = 0;
      const count = bw * bh;
      for (let y = y0; y < y0 + bh; y++) {
        let i = (y * imageWidth + x0) * 4;
        for (let x = 0; x < bw; x++) {
          totalR += data[i];
          totalG += data[i + 1];
          totalB += data[i + 2];
          i += 4;
        }
      }
      return {
        r: totalR / count / 255,
        g: totalG / count / 255,
        b: totalB / count / 255
      };
    }

    async function canvasToBitmap(sourceCanvas) {
      return createImageBitmap(sourceCanvas);
    }

    async function processCurrentImage() {
      if (!state.selectedBitmap) return;
      state.isProcessing = true;
      state.isImageProcessed = false;
      state.processedBitmap = null;
      updateButtons();
      showImage();
      await new Promise((resolve) => setTimeout(resolve, 30));

      const source = state.isGrayscale ? toGrayscaleBitmap(state.selectedBitmap) : (() => {
        const off = document.createElement("canvas");
        off.width = state.selectedBitmap.width;
        off.height = state.selectedBitmap.height;
        off.getContext("2d").drawImage(state.selectedBitmap, 0, 0);
        return off;
      })();

      const width = source.width;
      const height = source.height;
      const { horizontal: cols, vertical: rows } = GRID[state.selectedGridSize];
      const blockWidth = Math.floor(width / cols);
      const blockHeight = Math.floor(height / rows);
      const srcCtx = source.getContext("2d", { willReadFrequently: true });
      const image = srcCtx.getImageData(0, 0, width, height);
      const data = image.data;
      const pixelData = [];

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (blockWidth < 1 || blockHeight < 1) continue;
          const rgb = averageBlock(data, width, x * blockWidth, y * blockHeight, blockWidth, blockHeight);
          const gray = state.isGrayscale ? luminance(rgb.r, rgb.g, rgb.b) * 255 : null;
          pixelData.push({ x, y, rgb, gray });
        }
      }

      const mosaic = document.createElement("canvas");
      mosaic.width = width;
      mosaic.height = height;
      const mctx = mosaic.getContext("2d");
      mctx.drawImage(source, 0, 0);
      const drawW = width / cols;
      const drawH = height / rows;
      for (const pixel of pixelData) {
        if (state.isGrayscale) {
          const y = Math.round(pixel.gray);
          mctx.fillStyle = `rgb(${y}, ${y}, ${y})`;
        } else {
          const r = Math.round(pixel.rgb.r * 255);
          const g = Math.round(pixel.rgb.g * 255);
          const b = Math.round(pixel.rgb.b * 255);
          mctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
        }
        mctx.fillRect(pixel.x * drawW, pixel.y * drawH, drawW, drawH);
      }

      state.pixelData = pixelData;
      if (state.processedBitmap && state.processedBitmap.close) state.processedBitmap.close();
      state.processedBitmap = await canvasToBitmap(mosaic);
      state.isProcessing = false;
      state.isImageProcessed = true;
      showImage();
      updateButtons();
      renderPixelList();
    }

    function rgbInts(pixel) {
      return {
        r: Math.round(pixel.rgb.r * 255),
        g: Math.round(pixel.rgb.g * 255),
        b: Math.round(pixel.rgb.b * 255)
      };
    }

    function boxText(pixel) {
      if (state.isGrayscale) {
        return `(${pixel.x}, ${pixel.y}): Brightness = ${Math.round(pixel.gray || 0)}`;
      }
      const { r, g, b } = rgbInts(pixel);
      return `(${pixel.x}, ${pixel.y}): RGB = (${r}, ${g}, ${b})`;
    }

    function formattedData() {
      let result = "Mosaic Image Analysis\n";
      result += `Format: ${state.isGrayscale ? "Grayscale" : "RGB"}\n\n`;
      result += "Box Data (coordinates: values):\n";
      for (const pixel of state.pixelData) result += boxText(pixel) + "\n";
      return result;
    }

    function renderPixelList() {
      const fragment = document.createDocumentFragment();
      for (const pixel of state.pixelData) {
        const row = document.createElement("div");
        row.className = "pixel-row";
        const { r, g, b } = rgbInts(pixel);
        const fill = state.isGrayscale
          ? `rgb(${Math.round(pixel.gray)}, ${Math.round(pixel.gray)}, ${Math.round(pixel.gray)})`
          : `rgb(${r}, ${g}, ${b})`;
        const value = state.isGrayscale
          ? `Brightness: ${Math.round(pixel.gray)}`
          : `RGB: (${r}, ${g}, ${b})`;
        row.innerHTML =
          `<div class="pixel-xy">(${pixel.x}, ${pixel.y})</div>` +
          `<div class="pixel-val">${value}</div>` +
          `<div class="swatch" style="background:${fill}"></div>`;
        row.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          copyText(boxText(pixel)).then(() => showToast("Copied box data"));
        });
        fragment.appendChild(row);
      }
      pixelList.replaceChildren(fragment);
    }

    grayBtn.addEventListener("click", async () => {
      if (!state.selectedBitmap || state.isProcessing) return;
      state.isProcessing = true;
      updateButtons();
      await new Promise((resolve) => setTimeout(resolve, 20));

      if (state.isGrayscale) {
        state.selectedBitmap = state.originalBitmap;
        state.processedBitmap = null;
        state.isGrayscale = false;
        state.isProcessing = false;
        if (state.pixelData.length) {
          processCurrentImage();
        } else {
          showImage();
          updateButtons();
        }
      } else {
        const grayCanvas = toGrayscaleBitmap(state.selectedBitmap);
        const grayBitmap = await canvasToBitmap(grayCanvas);
        state.selectedBitmap = grayBitmap;
        state.processedBitmap = grayBitmap;
        state.isGrayscale = true;
        state.isProcessing = false;
        if (state.pixelData.length) {
          processCurrentImage();
        } else {
          showImage();
          updateButtons();
        }
      }
    });

    processBtn.addEventListener("click", async () => {
      if (state.isProcessing) return;
      if (state.isImageProcessed) {
        await saveImage();
      } else {
        processCurrentImage();
      }
    });

    async function saveImage() {
      if (!state.processedBitmap) return;
      const exportCanvas = document.createElement("canvas");
      exportCanvas.width = state.processedBitmap.width;
      exportCanvas.height = state.processedBitmap.height;
      exportCanvas.getContext("2d").drawImage(state.processedBitmap, 0, 0);
      exportCanvas.toBlob(async (blob) => {
        if (!blob) return;
        const file = new File([blob], "mosaic_image.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: "mosaic_image.png" });
            return;
          } catch (error) {
            if (error && error.name === "AbortError") return;
          }
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "mosaic_image.png";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }, "image/png");
    }

    showDataBtn.addEventListener("click", () => {
      if (!state.pixelData.length) return;
      dataSheet.classList.add("show");
    });
    document.getElementById("doneBtn").addEventListener("click", () => {
      dataSheet.classList.remove("show");
    });
    dataSheet.addEventListener("click", (event) => {
      if (event.target === dataSheet) dataSheet.classList.remove("show");
    });

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }
      } catch (_) {}
      const area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.focus();
      area.select();
      area.setSelectionRange(0, area.value.length);
      const ok = document.execCommand("copy");
      area.remove();
      if (!ok) throw new Error("copy failed");
    }

    document.getElementById("copyAllBtn").addEventListener("click", async () => {
      try {
        await copyText(formattedData());
        showToast("Copied");
      } catch (_) {
        showToast("Copy failed");
      }
    });

    document.getElementById("shareBtn").addEventListener("click", async () => {
      const text = formattedData();
      if (navigator.share) {
        try {
          await navigator.share({ title: "Pixel Data", text });
          return;
        } catch (error) {
          if (error && error.name === "AbortError") return;
        }
      }
      await copyText(text);
      showToast("Copied");
    });

    themeBtn.addEventListener("click", () => {
      state.isDarkMode = !state.isDarkMode;
      applyTheme();
    });

    zoomScroller.addEventListener("gesturestart", (event) => event.preventDefault());
    zoomScroller.addEventListener("gesturechange", (event) => {
      event.preventDefault();
      const next = Math.min(4, Math.max(1, state.zoom * event.scale));
      canvas.style.transform = `scale(${next})`;
    });
    zoomScroller.addEventListener("gestureend", () => {
      const match = /scale\(([^)]+)\)/.exec(canvas.style.transform || "");
      if (match) state.zoom = Math.min(4, Math.max(1, Number(match[1])));
    });

    updateButtons();
  </script>
</body>
</html>
